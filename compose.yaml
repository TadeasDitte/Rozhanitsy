name: rozhanitsy

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: ghcr.io/tadeasditte/rozhanitsy:${IMAGE_TAG:-main}
  restart: unless-stopped
  volumes:
    - storage:/app/storage

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-Rozhanitsy}
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-http://localhost:8000}
  APP_KEY: ${APP_KEY:-}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}

  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB:-rozhanitsy}
  DB_USERNAME: ${POSTGRES_USER:-rozhanitsy}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-rozhanitsy}

  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: database

  NVD_API_KEY: ${NVD_API_KEY:-}

  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      CONTAINER_ROLE: app
      SERVER_NAME: ":8080"
    ports:
      - "${APP_PORT:-8000}:8080"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    <<: *app
    environment:
      <<: *app-env
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rozhanitsy}
      POSTGRES_USER: ${POSTGRES_USER:-rozhanitsy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rozhanitsy}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_PASSWORD" psql -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  db:
  storage:
